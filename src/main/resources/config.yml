# ################################################################################################################ #
#   _  _____ ___                                                                                                   #
#  | |/ /_ _| _ )   This file can be used to customize the plugin's behavior. You can exclude some reactive or     #
#  | ' < | || _ \   interactable materials, either by blacklisting them or by disabling preconfigured categories.  #
#  |_|\_\___|___/   See all up-to-date material names here: https://jd.papermc.io/paper/org/bukkit/Material.html   #
#                                                                                                                  #
# ################################################################################################################ #

# Maximum number of reactive blocks to record.
# Setting this value too high is not recommended, as it could be exploited by a lag machine on your server.
# 500 is sufficient as you will rarely reach that many blocks.
max-blocks: 500

# By default, KIB is only enabled in Creative mode.
only-use-kib-in-creative-mode: true

# Toggle the use of the "PacketEvents" plugin if it is detected.
# KIB will use it to improve client-side rendering and performance, for example by canceling break sounds and particles.
use-packet-events-if-detected: true

# Blacklist interactable materials by their name, or disable categories below.
interactable-materials:
  blacklist: [ ]
  categories:
    campfires: true
    candles: true
    cauldrons: true
    # Taking vine berries (Cave vines + Cave vine plants)
    cave-vines: true
    # Putting or taking a book from a chiseled bookshelf
    chiseled-bookshelves: true
    comparators: true
    composters: true
    # Non-plain copper blocks that can be waxed or scraped
    copper-blocks: true
    daylight-detectors: true
    doors: true
    end-portal-frames: true
    gates: true
    # Putting a book on a lectern
    lecterns: true
    levers: true
    repeaters: true
    stone-buttons: true
    # Taking bush berries
    sweet-berry-bushes: true
    trap-doors: true
    wooden-buttons: true

# Blacklist reactive materials by their name, or disable categories below.
reactive-materials:
  blacklist: [ ]
  categories:
    amethyst-clusters: true
    bamboos: true
    banners: true
    beds: true
    bells: true
    cactus: true
    cakes: true
    carpets: true
    # Cave vines + Cave vine plants
    cave-vines: true
    # Chorus plants only (chorus flowers are not supported yet)
    chorus-plants: true
    cocoa: true
    crops: true
    comparators: true
    # Does not apply to waterlogged corals
    corals: true
    dead-bushes: true
    doors: true
    dripleaves: true
    # Fences + Iron bars + Copper bars
    fences: true
    # Ferns + Large ferns
    ferns: true
    flowers: true
    frogspawn: true
    fungus: true
    glass-panes: true
    glow-lichens: true
    grass: true
    hanging-roots: true
    hanging-signs: true
    ladders: true
    lanterns: true
    leaf-litters: true
    lily-pads: true
    mangrove-propagules: true
    mushrooms: true
    nether-roots: true
    nether-sprouts: true
    nether-warts: true
    pressure-plates: true
    rails: true
    redstone-wires: true
    repeaters: true
    saplings: true
    scaffolding: true
    sculk-veins: true
    sea-pickles: true
    signs: true
    snow: true
    # Pointed dripstones + Sulfur spikes
    speleothems: true
    sugar-canes: true
    sweet-berry-bushes: true
    # Levers + Stone buttons + Wooden buttons
    switches: true
    torches: true
    tripwire-hooks: true
    # Twisting vines + Twisting vine plants
    twisting-vines: true
    vines: true
    walls: true
    # Weeping vines + Weeping vine plants
    weeping-vines: true
