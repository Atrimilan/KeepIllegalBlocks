name: KeepIllegalBlocks
version: 1.4.3
main: io.github.atrimilan.keepillegalblocks.KeepIllegalBlocks
description: Prevent illegal blocks from breaking or being updated when a player interacts with an adjacent block
author: Atrimilan
website: https://github.com/Atrimilan/KeepIllegalBlocks
api-version: '1.20.6'

softdepend:
  - ProtocolLib
  - ProtocolSupport
  - ViaVersion
  - ViaBackwards
  - ViaRewind
  - Geyser-Spigot
  - packetevents # PacketEvents plugin is optional (and all of the above are required as soft dependencies by PacketEvents)

permissions:
  kib.*:
    description: Access all '/kib' commands
    default: op
    children:
      kib.admin: true
  kib.admin:
    description: Access all '/kib' commands
    default: op
    children:
      kib: true
      kib.reload: true
      kib.blacklist: true
      kib.rule: true
  kib.reload:
    description: Reload KIB
    default: op
    children:
      kib: true
  kib.rule:
    description: Configure KIB rules
    default: op
    children:
      kib: true
  kib.blacklist:
    description: Add and remove materials from blacklists
    default: op
    children:
      kib: true
  kib:
    description: Access the base '/kib' command and '/kib help'
    default: op
